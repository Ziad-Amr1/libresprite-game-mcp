[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libresprite-game-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for LibreSprite designed for game asset creation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pillow>=10.0.0",
    "aseprite>=0.1.0",
]

[project.scripts]
libresprite-game-mcp = "libresprite_game_mcp.server:main"
